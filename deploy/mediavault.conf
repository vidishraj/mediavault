# MediaVault — nginx vhost (install to /etc/nginx/conf.d/mediavault.conf).
# Mirrors the *.vidish.online pattern on this box (see <other-vhost>.conf / <other-vhost>.conf).
# Cert issued separately: certbot certonly --webroot -w /var/www/mediavault-acme
#   -d mediavault.vidish.online   (see deploy/DEPLOY.md).
#
# Serving model: static Vite SPA at / (dist/), same-origin mock API proxied at /api/.
# The client only ever calls relative /api/... so there is NO CORS and server/ needs no edit.

server {
    listen 80;
    server_name mediavault.vidish.online;
    location /.well-known/acme-challenge/ { root /var/www/mediavault-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name mediavault.vidish.online;

    ssl_certificate     /etc/letsencrypt/live/mediavault.vidish.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mediavault.vidish.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root <app-dir>/dist;
    index index.html;

    # ---- SSE progress stream: /api/events must arrive INCREMENTALLY --------------
    # Regex-free exact match beats the /api/ prefix. Disable every layer that would
    # buffer the event stream into one lump: proxy buffering, cache, and gzip.
    location = /api/events {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
    }

    # ---- Same-origin mock API ----------------------------------------------------
    # X-Real-IP / X-Forwarded-For are set here as correct reverse-proxy practice, BUT
    # the FROZEN mock API keys its 80-req/10s rate limiter on req.socket.remoteAddress
    # (server/index.mjs:184) and ignores these headers — so behind this proxy every
    # visitor collapses into ONE shared bucket and they rate-limit each other. This is
    # a genuine API limitation, documented as critique in SUBMISSION.md; it is NOT
    # worked around by editing server/ (frozen). Kept the headers so the fix is a
    # one-line server change, not an infra change.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- Static SPA --------------------------------------------------------------
    # Hashed assets are immutable and safe to cache hard; index.html must not be cached
    # so a redeploy is picked up immediately.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
